<!DOCTYPE html>
<html lang="en">
<head>
    <title>Atlantis | Contact</title>
    <meta charset="utf-8">
    <link href="/styles/styles.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div id="wrapper">
        <header>
            <h1>Atlantis</h1>
        </header>

        <div class="content-row">
            <div class="nav-column" aria-hidden="true"></div>

            <nav>
                <ul>
                    <li><a href="/index.html">Home</a></li>
                    <li><a href="/cave.html">Cave</a></li>
                    <li><a href="/sea.html">Sea</a></li>
                    <li><a href="/events.html">Weekend Events</a></li>
                    <li><a href="/contact.html">Contact</a></li>
                </ul>
            </nav>

            <main>
                <h3>Contact form</h3>
                <img src="/images/logo.jpeg" alt="logo" class="responsive">

                <form id="contact-form" novalidate>
                    <label for="Name">Name:</label>
                    <input type="text" id="Name" name="Name" required data-testid="contact-name-input">

                    <label for="Number">Number:</label>
                    <input type="tel" id="Number" name="Number" data-testid="contact-number-input">

                    <label for="Email">E-mail:</label>
                    <input type="email" id="Email" name="Email" data-testid="contact-email-input">

                    <textarea id="flash-input" name="Questions" placeholder="Questions???" data-testid="contact-questions-input"></textarea>
                    <textarea id="focus-input" name="Request" placeholder="Request..." data-testid="contact-request-input"></textarea>

                    <div id="form-status" class="form-status" role="status" aria-live="polite"></div>

                    <div class="button-container">
                        <button type="reset" data-testid="contact-reset-btn">Restart</button>
                        <button type="submit" data-testid="contact-submit-btn">Contact Us</button>
                    </div>
                </form>

                <!-- Thank-you overlay shown after a successful submission -->
                <div id="thank-you" class="thank-you" hidden data-testid="contact-thank-you">
                    <h2 data-testid="contact-thank-you-headline">Thank you Mrs. Boatman</h2>
                    <p data-testid="contact-thank-you-tagline">WebDesign is LEGIT</p>
                    <button type="button" id="thank-you-close" data-testid="contact-thank-you-close">Send another message</button>
                </div>
            </main>
        </div>

        <footer>
            Copyright &copy; 2026 Atlantis |
            <a href="mailto:Derrick@Baker.com">Webmaster</a>
        </footer>
    </div>

    <script src="/styles/transition.js"></script>
    <script>
        (function () {
            const form = document.getElementById("contact-form");
            const statusEl = document.getElementById("form-status");
            const thankYou = document.getElementById("thank-you");
            const closeBtn = document.getElementById("thank-you-close");

            // Resolve backend URL: in this Emergent preview, the same origin
            // is routed to backend at /api/*; in plain local dev we can fall
            // back to localhost:8001.
            const API_BASE = window.location.origin;

            function setStatus(msg, kind) {
                statusEl.textContent = msg || "";
                statusEl.className = "form-status" + (kind ? " " + kind : "");
            }

            form.addEventListener("submit", async function (e) {
                e.preventDefault();
                const submitBtn = form.querySelector('button[type="submit"]');
                const data = {
                    name:      document.getElementById("Name").value.trim(),
                    number:    document.getElementById("Number").value.trim(),
                    email:     document.getElementById("Email").value.trim(),
                    questions: document.getElementById("flash-input").value.trim(),
                    request:   document.getElementById("focus-input").value.trim(),
                    page:      window.location.pathname
                };

                if (!data.name) {
                    setStatus("Please enter your name.", "error");
                    document.getElementById("Name").focus();
                    return;
                }

                setStatus("Sending your message...", "pending");
                submitBtn.disabled = true;

                try {
const res = await fetch("http://localhost:5001/api/contact", {                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(data)
                    });
                    if (!res.ok) {
                        const detail = await res.text();
                        throw new Error("Server returned " + res.status + " " + detail);
                    }
                    // Success — show the thank-you overlay
                    setStatus("", "");
                    form.reset();
                    thankYou.hidden = false;
                    thankYou.scrollIntoView({ behavior: "smooth", block: "center" });
                } catch (err) {
                    setStatus("Sorry — your message could not be sent. Please try again. (" + err.message + ")", "error");
                } finally {
                    submitBtn.disabled = false;
                }
            });

            closeBtn.addEventListener("click", function () {
                thankYou.hidden = true;
                setStatus("", "");
                document.getElementById("Name").focus();
            });
        })();
    </script>
</body>
</html>
